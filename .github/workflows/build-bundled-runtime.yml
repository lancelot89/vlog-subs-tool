name: Build Bundled Runtime Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for manual release uploads'
        required: false
        default: 'manual-build'

permissions:
  contents: write
  actions: read

jobs:
  bundle-windows:
    name: Build Windows bundle
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION | Select-Object -First 1).Trim()
          if (-not $version) {
            throw 'VERSION file is empty'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding UTF8 -Append

      - name: Build bundled environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\AppRoot | Out-Null
          ./scripts/build_env.ps1 -TargetDir (Resolve-Path dist\AppRoot)

      - name: Stage application files
        shell: pwsh
        run: |
          $dest = Resolve-Path 'dist\\AppRoot'
          Copy-Item -Path app -Destination $dest -Recurse
          Copy-Item -Path README_start_here.md, README.md, VERSION, LICENSE, run.bat -Destination $dest

      - name: Smoke test launcher
        shell: pwsh
        run: |
          $python = Join-Path (Resolve-Path 'dist\\AppRoot') 'env\\Scripts\\python.exe'
          & $python -m app.main --check

      - name: Archive Windows bundle
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $distDir = Resolve-Path 'dist'
          $bundlePath = Join-Path $distDir "vlog-subs-tool-$env:APP_VERSION-windows.zip"
          if (Test-Path $bundlePath) {
            Remove-Item $bundlePath
          }
          Compress-Archive -Path (Join-Path $distDir 'AppRoot') -DestinationPath $bundlePath -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if (Test-Path 'installer/output') {
            Remove-Item 'installer/output' -Recurse -Force
          }
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            throw 'ISCC.exe was not found after installing Inno Setup'
          }
          & $iscc.Source installer/installer.iss
          $source = Get-Item 'installer/output/VlogSubsToolSetup.exe'
          $dest = Join-Path (Resolve-Path 'dist') "VlogSubsToolSetup-$env:APP_VERSION.exe"
          Copy-Item $source.FullName $dest -Force

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundled-runtime
          path: dist/vlog-subs-tool-${{ steps.version.outputs.version }}-windows.zip

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/VlogSubsToolSetup-${{ steps.version.outputs.version }}.exe

  bundle-macos:
    name: Build macOS bundle
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version
        id: version
        run: |
          version=$(head -n 1 VERSION | tr -d '\r')
          if [ -z "$version" ]; then
            echo 'VERSION file is empty' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build bundled environment
        run: |
          mkdir -p dist/AppRoot
          ./scripts/build_env.sh dist/AppRoot

      - name: Stage application files
        run: |
          dest="$(pwd)/dist/AppRoot"
          rsync -a app "$dest"/
          cp README_start_here.md README.md VERSION LICENSE run.command "$dest"/
          chmod +x "$dest/run.command"

      - name: Smoke test launcher
        run: |
          dist/AppRoot/env/bin/python -m app.main --check

      - name: Archive macOS bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          rm -f "vlog-subs-tool-${APP_VERSION}-macos.zip"
          zip -r "vlog-subs-tool-${APP_VERSION}-macos.zip" AppRoot

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundled-runtime
          path: dist/vlog-subs-tool-${{ steps.version.outputs.version }}-macos.zip

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - bundle-windows
      - bundle-macos
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(head -n 1 VERSION | tr -d '\r')
          if [ -z "$version" ]; then
            echo 'VERSION file is empty' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Determine release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag_name }}"
            if [ -z "$tag" ]; then
              echo '::error::tag_name input is required for manual runs'
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v5

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-bundled-runtime/*
            windows-installer/*
            macos-bundled-runtime/*
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: VLog字幕ツール ${{ steps.version.outputs.version }}
          body: |
            ## 📦 Assets
            - Windows 同梱ランタイム ZIP (`vlog-subs-tool-${{ steps.version.outputs.version }}-windows.zip`)
            - Windows インストーラー (`VlogSubsToolSetup-${{ steps.version.outputs.version }}.exe`)
            - macOS 同梱ランタイム ZIP (`vlog-subs-tool-${{ steps.version.outputs.version }}-macos.zip`)

            ## 🚀 起動方法
            - **Windows**: ZIPを展開して `run.bat` を実行、またはインストーラーを利用してください。
            - **macOS**: ZIPを展開して `run.command` をダブルクリックしてください。初回は右クリック→「開く」でGatekeeperを回避できます。

            ## 🧪 診断
            展開後に `env/bin/python -m app.main --check` (macOS) または `env\Scripts\python.exe -m app.main --check` (Windows) で依存チェックを実行できます。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
