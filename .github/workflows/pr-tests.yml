name: Pull Request Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black isort mypy pytest pytest-cov

    - name: Check code formatting with black
      run: |
        black --check --diff app/ tests/

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff --profile=black app/ tests/

    - name: Type checking with mypy
      run: |
        mypy app/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true  # mypy issues shouldn't block PRs

    - name: Run unit tests
      run: |
        python -m pytest tests/unit/ -v --tb=short
      continue-on-error: true  # test failures are informational

  bundled-runtime:
    runs-on: ubuntu-latest
    name: Bundled Runtime Smoke Test

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          qt6-base-dev \
          libgl1-mesa-dev \
          libxcb-xinerama0 \
          libegl1-mesa-dev \
          libxkbcommon-x11-0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-render-util0 \
          libxcb-xkb1 \
          libfontconfig1 \
          libfreetype6

    - name: Build embedded runtime
      run: |
        bash scripts/build_env.sh dist/test-runtime

    - name: Run diagnostics check
      run: |
        dist/test-runtime/env/bin/python -m app.main --check

    - name: Validate launcher scripts
      run: |
        bash -n run.command
        python -m compileall run.bat
      shell: bash

  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Security Check

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install safety
      run: |
        python -m pip install --upgrade pip
        pip install safety

    - name: Check dependencies for security vulnerabilities
      run: |
        pip install -r requirements.txt
        safety check --json || true  # Don't fail on vulnerabilities for now

    - name: Check for outdated dependencies
      run: |
        pip list --outdated || true
