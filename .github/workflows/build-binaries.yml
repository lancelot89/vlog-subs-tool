name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'  # v1.0.0 などのタグがプッシュされた時
  workflow_dispatch:  # 手動実行も可能
    inputs:
      tag_name:
        description: 'Tag name for manual release'
        required: false
        default: 'manual-build'
  workflow_call:  # 他のワークフローから呼び出し可能
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          qt6-base-dev \
          libgl1-mesa-dev \
          libxcb-xinerama0 \
          libegl1-mesa-dev \
          libxkbcommon-x11-0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-render-util0 \
          libxcb-xkb1 \
          libfontconfig1 \
          libfreetype6
    
    - name: Install Python dependencies (minimal config)
      run: |
        python -m pip install --upgrade pip
        # Use minimal dependencies for stable builds (Issue #216)
        pip install -r requirements-minimal.txt

    - name: Build Linux binary (simplified PyInstaller)
      run: |
        echo "Building with minimal PyInstaller configuration..."
        # Issue #216: Use simplified spec file for stable builds
        pyinstaller --clean --distpath dist/linux --workpath build/linux vlog-subs-tool-minimal.spec

        # Verify binary was created
        if [ ! -f "dist/linux/vlog-subs-tool/vlog-subs-tool" ]; then
          echo "❌ Binary build failed - executable not found"
          ls -la dist/linux/ || echo "dist/linux/ directory not found"
          exit 1
        fi

        echo "✅ Linux binary build completed"
        du -sh dist/linux/vlog-subs-tool/
    
    - name: Create Linux archive
      shell: bash
      run: |
        cd dist/linux
        tar -czf "vlog-subs-tool-linux.tar.gz" vlog-subs-tool/
        # READMEファイルを追加
        cat > README_Linux.txt << 'EOF'
        VLog字幕ツール Linux版

        使用方法:
        1. tar.gzファイルを展開: tar -xzf vlog-subs-tool-linux.tar.gz
        2. 実行権限を付与: chmod +x vlog-subs-tool/vlog-subs-tool
        3. 実行: ./vlog-subs-tool/vlog-subs-tool

        注意事項:
        - フォルダ内のファイルを削除しないでください
        - 実行ファイルのみを移動すると動作しません
        - Ubuntu 20.04+ または同等のディストリビューションが必要です
        EOF
        tar -czf "vlog-subs-tool-linux.tar.gz" vlog-subs-tool/ README_Linux.txt

    - name: Upload Linux binary
      uses: actions/upload-artifact@v4
      with:
        name: vlog-subs-tool-linux
        path: dist/linux/vlog-subs-tool-linux.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install Python dependencies (minimal config)
      run: |
        python -m pip install --upgrade pip
        # Use minimal dependencies for stable builds (Issue #216)
        pip install -r requirements-minimal.txt

    - name: Build Windows binary (simplified PyInstaller)
      shell: bash
      run: |
        echo "Building with minimal PyInstaller configuration..."
        # Issue #216: Use simplified spec file for stable builds
        pyinstaller --clean --distpath dist/windows --workpath build/windows vlog-subs-tool-minimal.spec

        # Verify binary was created
        if [ ! -f "dist/windows/vlog-subs-tool/vlog-subs-tool.exe" ]; then
          echo "❌ Binary build failed - executable not found"
          ls -la dist/windows/ || echo "dist/windows/ directory not found"
          exit 1
        fi

        echo "✅ Windows binary build completed"
        du -sh dist/windows/vlog-subs-tool/ || echo "Size calculation failed"
    
    - name: Create Windows ZIP archive
      shell: pwsh
      run: |
        Set-Location dist/windows

        # READMEファイルを作成
        $readmeContent = "VLog字幕ツール Windows版`n`n使用方法:`n1. ZIPファイルを適当なフォルダに展開`n2. フォルダ内の vlog-subs-tool.exe をダブルクリックして実行`n3. Windows Defenderの警告が出た場合は「詳細情報」→「実行」をクリック`n`n注意事項:`n- フォルダ内のファイルを削除しないでください`n- 実行ファイルのみを移動すると動作しません"
        $readmeContent | Out-File -FilePath "README_Windows.txt" -Encoding UTF8

        # PowerShellのCompress-Archiveを使用してZIP作成
        Compress-Archive -Path "vlog-subs-tool", "README_Windows.txt" -DestinationPath "vlog-subs-tool-windows.zip" -Force

    - name: Upload Windows binary
      uses: actions/upload-artifact@v4
      with:
        name: vlog-subs-tool-windows
        path: dist/windows/vlog-subs-tool-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install Python dependencies (minimal config)
      run: |
        python -m pip install --upgrade pip
        # Use minimal dependencies for stable builds (Issue #216)
        pip install -r requirements-minimal.txt

    - name: Build macOS binary (simplified PyInstaller)
      run: |
        echo "Building with minimal PyInstaller configuration..."
        # Issue #216: Use simplified spec file for stable builds
        pyinstaller --clean --distpath dist/macos --workpath build/macos vlog-subs-tool-macos-minimal.spec

        # Verify binary was created
        if [ ! -d "dist/macos/VLog字幕ツール.app" ]; then
          echo "❌ Binary build failed - app bundle not found"
          ls -la dist/macos/ || echo "dist/macos/ directory not found"
          exit 1
        fi

        # Verify executable inside app bundle
        if [ ! -f "dist/macos/VLog字幕ツール.app/Contents/MacOS/VLog字幕ツール" ]; then
          echo "❌ Binary build failed - executable not found in app bundle"
          ls -la "dist/macos/VLog字幕ツール.app/Contents/MacOS/" || echo "MacOS directory not found"
          exit 1
        fi

        echo "✅ macOS binary build completed"
        du -sh "dist/macos/VLog字幕ツール.app"

    - name: Fix macOS app permissions
      run: |
        # .appバンドル内の実行権限を設定
        if [ -d "dist/macos/VLog字幕ツール.app" ]; then
          chmod +x "dist/macos/VLog字幕ツール.app/Contents/MacOS/VLog字幕ツール"
          # macOSでのGatekeeper警告を回避するため、拡張属性を削除
          xattr -cr "dist/macos/VLog字幕ツール.app" || true
        fi
    
    - name: Create macOS ZIP archive
      shell: bash
      run: |
        cd dist/macos
        # READMEファイルを作成
        cat > README_macOS.txt << 'EOF'
        VLog字幕ツール macOS版

        使用方法:
        1. ZIPファイルを展開
        2. VLog字幕ツール.appをアプリケーションフォルダに移動（推奨）
        3. 右クリックで「開く」を選択（初回のみ）
        4. セキュリティ警告で「開く」をクリック
        5. 以降はダブルクリックで起動可能

        注意事項:
        - .appファイルは単一のファイルです
        - macOS 10.15 (Catalina) 以上が必要です
        EOF
        zip -r "vlog-subs-tool-macos.zip" "VLog字幕ツール.app" README_macOS.txt

    - name: Upload macOS binary
      uses: actions/upload-artifact@v4
      with:
        name: vlog-subs-tool-macos
        path: dist/macos/vlog-subs-tool-macos.zip

  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v5
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          vlog-subs-tool-linux/vlog-subs-tool-linux.tar.gz
          vlog-subs-tool-windows/vlog-subs-tool-windows.zip
          vlog-subs-tool-macos/vlog-subs-tool-macos.zip
        tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
        name: VLog字幕ツール ${{ github.event.inputs.tag_name || github.ref_name }}
        body: |
          ## 🎬 VLog字幕ツール ${{ github.event.inputs.tag_name || github.ref_name }}

          ### ⚡ Issue #216対応: 最小構成ビルド

          このバージョンから **PyInstaller設定を簡素化** し、ソース実行と完全同一挙動を実現しました：
          - ImportError の解消（過度な除外設定を撤廃）
          - 安定性の向上（デフォルト設定重視）
          - ビルドプロセスの単純化

          **注意**: バイナリサイズは一時的に増加しますが、動作安定性を優先しています。

          ### 📦 ダウンロード

          - **Linux**: `vlog-subs-tool-linux.tar.gz` (実行ディレクトリのアーカイブ)
          - **Windows**: `vlog-subs-tool-windows.zip` (実行ディレクトリのZIP)
          - **macOS**: `vlog-subs-tool-macos.zip` (アプリケーションバンドルのZIP)

          ### 🚀 使用方法

          #### Windows
          1. `vlog-subs-tool-windows.zip` をダウンロード
          2. ZIPファイルを適当なフォルダに展開
          3. フォルダ内の `vlog-subs-tool.exe` をダブルクリックして実行
          4. Windows Defenderの警告が出た場合は「詳細情報」→「実行」をクリック
          5. ⚠️ **重要**: フォルダ内のファイルを削除せず、実行ファイルのみ移動しないでください

          #### macOS
          1. `vlog-subs-tool-macos.zip` をダウンロード
          2. ZIPファイルを展開
          3. `VLog字幕ツール.app` をアプリケーションフォルダに移動（推奨）
          4. 右クリックで「開く」を選択（初回のみ）
          5. セキュリティ警告で「開く」をクリック

          #### Linux
          1. `vlog-subs-tool-linux.tar.gz` をダウンロード
          2. アーカイブを展開: `tar -xzf vlog-subs-tool-linux.tar.gz`
          3. 実行権限を付与: `chmod +x vlog-subs-tool/vlog-subs-tool`
          4. 実行: `./vlog-subs-tool/vlog-subs-tool`

          ### 📋 システム要件
          
          - **Windows**: Windows 10/11 (64bit)
          - **macOS**: macOS 10.15+
          - **Linux**: Ubuntu 20.04+ または同等のディストリビューション

          ### ⚠️ 注意事項
          
          - 初回起動時にOCRモデルのダウンロードが必要です
          - インターネット接続が必要です
          - ウイルス対策ソフトで誤検知される場合があります
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}